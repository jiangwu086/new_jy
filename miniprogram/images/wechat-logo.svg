<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 绿色圆角背景 -->
  <rect width="100" height="100" rx="22" ry="22" fill="#07C160"/>
  <!-- 大气泡（左上） -->
  <ellipse cx="40" cy="42" rx="23" ry="18" fill="white"/>
  <!-- 大气泡尾巴 -->
  <polygon points="24,56 18,66 34,58" fill="white"/>
  <!-- 大气泡眼睛 -->
  <circle cx="33" cy="41" r="3.5" fill="#07C160"/>
  <circle cx="47" cy="41" r="3.5" fill="#07C160"/>
  <!-- 小气泡（右下） -->
  <ellipse cx="62" cy="60" rx="19" ry="15" fill="white"/>
  <!-- 小气泡尾巴 -->
  <polygon points="75,72 82,80 70,74" fill="white"/>
  <!-- 小气泡眼睛 -->
  <circle cx="56" cy="59" r="2.8" fill="#07C160"/>
  <circle cx="68" cy="59" r="2.8" fill="#07C160"/>
</svg>
