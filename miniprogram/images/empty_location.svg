  <!-- 地图轮廓 -->
  <rect x="30" y="80" width="140" height="90" rx="12" fill="#EEF2FB"/>
  <rect x="30" y="80" width="140" height="90" rx="12" stroke="#C8D3EE" stroke-width="2"/>
  
  <!-- 地图折痕线 -->
  <line x1="80" y1="80" x2="80" y2="170" stroke="#C8D3EE" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="130" y1="80" x2="130" y2="170" stroke="#C8D3EE" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="30" y1="118" x2="170" y2="118" stroke="#C8D3EE" stroke-width="1.5" stroke-dasharray="4 3"/>
  
  <!-- 定位 PIN -->
  <path d="M100 30 C85 30 74 42 74 56 C74 74 100 100 100 100 C100 100 126 74 126 56 C126 42 115 30 100 30Z" fill="#4A7FD4"/>
  <circle cx="100" cy="56" r="11" fill="white"/>
  
