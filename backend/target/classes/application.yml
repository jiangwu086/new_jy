server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: new-jy-backend

  # Jackson 日期序列化：LocalDateTime → "2026-04-01 10:30:00" 字符串，而非数组
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # PostgreSQL 数据库配置
  datasource:
    driver-class-name: org.postgresql.Driver
    # 请根据您的实际 PG 数据库调整
    url: jdbc:postgresql://localhost:5432/jy_safety
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # Redis 配置 (用于并发防刷锁、状态缓存)
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chocwell.jy.entity
  global-config:
    db-config:
      # 全局主键使用数据库序列自动增长（对应 PostgreSQL 的 BIGSERIAL）
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ─── 业务自定义配置 ────────────────────────────────────────────
app:
  # ── 微信小程序 ──────────────────────────────────────────────
  wx:
    appid: wxc6baae0e8851c6c7
    secret: 22ca676d65ef05f67545023aa67b5beb
    # ⚠️ 在微信公众平台"订阅消息"中申请模板后，将模板ID填入下方
    # 微信公众平台地址：https://mp.weixin.qq.com → 功能 → 订阅消息
    tmpl-checkin: "YsrXmHlp_saK8CNnl_HttHQ-kLHkDpb9o2oPgcrMJiw"   # 打卡成功通知 模板ID
    tmpl-gift:    "cQ5oalByIPAaIq0Hwl10Df1w2pCJxgJ7tZrei_c37oM"   # 礼品兑换成功通知 模板ID

  # ── JWT ────────────────────────────────────────────────────
  jwt:
    secret: change_this_to_a_long_random_secret_string_in_production  # ⚠️ 生产必须换强随机值
    expire-days: 30        # token 有效天数

  # ── 阿里云短信 ──────────────────────────────────────────────
  # 在阿里云控制台开通短信服务后填入以下信息
  # 控制台地址：https://dysms.console.aliyun.com
  sms:
    access-key-id: your_aliyun_access_key_id          # ⚠️ 阿里云 RAM 用户 AccessKeyId
    access-key-secret: your_aliyun_access_key_secret  # ⚠️ 阿里云 RAM 用户 AccessKeySecret
    sign-name: 你的短信签名                            # ⚠️ 需在阿里云控制台审核通过的签名
    template-code: SMS_xxxxxxxxx                      # ⚠️ 模板 CODE，如 SMS_12345678
    # 短信模板内容示例（在阿里云控制台创建）：
    # "您的验证码为${code}，5分钟内有效，请勿泄露。"

# ─── 监控端点配置 ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
